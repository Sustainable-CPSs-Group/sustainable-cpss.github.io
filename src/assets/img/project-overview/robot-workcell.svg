<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title description">
  <title id="title">Sustainable CPS in a robot workcell</title>
  <desc id="description">Illustrative research scenario. Sensors attached to a robot arm monitor vibration and temperature. Harvested energy supports intermittent sensing and local inference. Low-power wireless communication sends useful reports to AI and an engineer, who can request more measurements and plan maintenance. The complete batteryless system is a research goal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#35634e" stroke-width="1.5"/></marker>
    <marker id="energy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#98763c" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1400" height="800" fill="#fcfcfa"/>
  <g id="heading" fill="#27332f">
    <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6" fill="#626b65">ILLUSTRATIVE CASE STUDY · RESEARCH VISION</text>
    <text x="40" y="88" font-family="Georgia, Times New Roman, serif" font-size="34">Sustainable CPS in a robot workcell</text>
    <text x="40" y="119" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b65">How could we detect joint wear without adding sensors that need regular battery replacement?</text>
  </g>
  <g id="workcell">
    <rect x="40" y="151" width="684" height="486" rx="5" fill="#f1f4ef" stroke="#d5ded5"/>
    <text x="62" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#626b65" letter-spacing="1">PHYSICAL SYSTEM · ROBOT ARM AND ATTACHED SENSORS</text>
    <g id="workcell-floor" stroke="#d3dbd3" fill="none" stroke-width="1.5">
      <path d="M69 552h627M91 575h578M116 598h528M113 533l-43 77m140-77-20 77m117-77v77m97-77 20 77m77-77 43 77m54-77 62 77"/>
    </g>
    <g id="conveyor" stroke="#839286" stroke-width="2" fill="#e4eae3" stroke-linejoin="round">
      <path d="M456 488h207l31 26H476Z"/><path d="M476 514h218v25H476ZM493 539v42m177-42v42"/>
      <path d="m490 491 22 20m12-20 22 20m12-20 22 20m12-20 22 20m12-20 22 20" fill="none"/>
      <path d="M561 463h40v28h-40Z" fill="#d2dfce"/>
    </g>
    <g id="robot-arm" stroke="#526f5b" stroke-width="3" stroke-linejoin="round">
      <path d="M191 501h133l21 34H175Z" fill="#c8d6c6"/>
      <path d="M209 451h98v50h-98Z" fill="#dce5d8"/>
      <path d="m227 454 45-131 47 18-48 124Z" fill="#d8e2d4"/>
      <path d="m284 333 138-94 22 37-131 97Z" fill="#e2e8dd"/>
      <path d="m433 244 95 82-25 29-94-82Z" fill="#c8d6c6"/>
      <path d="m511 339 44 40-15 18-42-36Z" fill="#e2e8dd"/>
      <circle cx="257" cy="456" r="27" fill="#c4d3c1"/>
      <circle cx="292" cy="342" r="32" fill="#c4d3c1"/>
      <circle cx="426" cy="258" r="26" fill="#c4d3c1"/>
      <circle cx="513" cy="342" r="21" fill="#c4d3c1"/>
      <circle cx="292" cy="342" r="13" fill="#f5f7f1"/>
      <circle cx="426" cy="258" r="10" fill="#f5f7f1"/>
      <circle cx="257" cy="456" r="10" fill="#f5f7f1"/>
      <path d="m547 388 25 16-6 18m-25-23 1 22 13 9" fill="none" stroke-width="5" stroke-linecap="round"/>
      <path d="M273 449q29-91 24-110L426 252l89 88" fill="none" stroke="#84967f" stroke-width="1.5"/>
    </g>
    <g id="attached-sensors" fill="#28634f" stroke="#fcfcfa" stroke-width="2">
      <rect x="303" y="314" width="22" height="27" rx="3"/>
      <rect x="430" y="231" width="22" height="27" rx="3"/>
      <circle cx="314" cy="323" r="2" fill="#fcfcfa" stroke="none"/>
      <circle cx="441" cy="240" r="2" fill="#fcfcfa" stroke="none"/>
    </g>
    <g id="sensor-callout" fill="none" stroke="#35634e" stroke-width="1.5">
      <path d="M314 314v-89H86"/>
      <circle cx="314" cy="314" r="3" fill="#35634e"/>
    </g>
    <text x="86" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">Vibration and temperature</text>
    <g id="energy-harvesting" stroke="#98763c" stroke-width="1.7" fill="none" stroke-linecap="round">
      <circle cx="104" cy="376" r="12"/><path d="M104 352v5m0 38v5m-24-24h5m38 0h5m-41-17 4 4m26 26 4 4m0-34-4 4m-26 26-4 4"/>
      <path d="M82 406h44l-8 24H74Zm-4 12h44m-25-12-8 24m22-24-8 24"/>
      <path d="M129 418h30v-90h134" marker-end="url(#energy-arrow)"/>
    </g>
    <text x="73" y="459" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#745b30">Harvest light</text>
    <text x="73" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#745b30">or vibration</text>
    <text x="73" y="619" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#626b65">Example: monitor a joint for signs of developing wear.</text>
  </g>
  <g id="reports-to-sensor-model" fill="none" stroke="#35634e" stroke-width="1.6">
    <path d="M452 242H588V208h174" marker-end="url(#arrow)"/>
  </g>
  <g id="sensor-processing">
    <rect x="774" y="151" width="586" height="131" rx="5" fill="#ffffff" stroke="#cedbd2"/>
    <text x="798" y="184" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#27332f">1. Sense with the energy available</text>
    <text x="798" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">Store harvested energy; sense and infer across power cycles.</text>
    <text x="798" y="241" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">A local model flags unusual vibration and prepares a report.</text>
    <path d="M798 263h34" stroke="#6f9075" stroke-width="2"/>
  </g>
  <path d="M1067 282v26" fill="none" stroke="#35634e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g id="wireless-network">
    <rect x="774" y="318" width="586" height="131" rx="5" fill="#ffffff" stroke="#cedbd2"/>
    <text x="798" y="351" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#27332f">2. Communicate what matters</text>
    <text x="798" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">BLE and other low-power links carry useful reports.</text>
    <text x="798" y="408" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">Connectionless reporting and wake-up grants share airtime.</text>
    <path d="M798 430h34" stroke="#6f9075" stroke-width="2"/>
  </g>
  <path d="M1067 449v26" fill="none" stroke="#35634e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g id="diagnostics-and-engineer">
    <rect x="774" y="485" width="586" height="152" rx="5" fill="#ffffff" stroke="#cedbd2"/>
    <g id="engineer-and-display" transform="translate(1258 504)" stroke="#526f5b" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="0" y="4" width="47" height="34" rx="3"/><path d="M8 27h7l6-13 7 18 7-11h5M23 38v10m-13 0h26"/>
      <circle cx="63" cy="36" r="8"/><path d="M51 63v-6a12 12 0 0 1 24 0v6"/>
    </g>
    <text x="798" y="518" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#27332f">3. Diagnose with an engineer</text>
    <text x="798" y="551" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">AI combines reports; an engineer reviews the evidence.</text>
    <text x="798" y="579" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">Request more detail and check rules before adapting.</text>
    <text x="798" y="607" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#27332f">Use the diagnosis to decide when a joint needs inspection.</text>
  </g>
  <g id="feedback-to-sensors" fill="none" stroke="#35634e" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M774 581H745V303H454V266" marker-end="url(#arrow)"/>
  </g>
  <text x="569" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#35634e">Adapt sampling</text>
  <text x="569" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#35634e">and radio schedules</text>
  <g id="maintenance-feedback" fill="none" stroke="#35634e" stroke-width="1.6">
    <path d="M1112 637v54H378v-44" marker-end="url(#arrow)"/>
  </g>
  <text x="744" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#35634e">Plan inspection and maintenance from measured condition</text>
  <path d="M40 727h1320" stroke="#d5ded5"/>
  <text x="40" y="758" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#35634e">Research goals: less battery servicing · fewer unnecessary transmissions · longer equipment life</text>
  <text x="40" y="784" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#626b65">Illustrative scenario, not a claim of a completed deployment. The full adaptive, batteryless system remains a research goal.</text>
</svg>
