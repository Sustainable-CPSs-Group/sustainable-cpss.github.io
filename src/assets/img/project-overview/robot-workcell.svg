  <g fill="#35634e" stroke="none">
    <circle cx="496" cy="90" r="3"/>
    <circle cx="496" cy="234" r="3"/>
    <circle cx="496" cy="378" r="3"/>
  </g>
  <g id="sensing">
    <rect x="546" y="26" width="458" height="128" rx="3" fill="#ffffff" stroke="#dce3df"/>
    <text x="574" y="72" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="20" fill="#27332f">1. Sense with the energy available</text>
    <text x="574" y="102" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#626b65">Harvested energy powers sensing and local</text>
    <text x="574" y="122" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#626b65">inference across power cycles.</text>
    <g transform="translate(944 90)" stroke="#4f6b5c" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-17" y="-25" width="34" height="30" rx="3" fill="#e9eee7"/>
